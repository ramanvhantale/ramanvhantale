name: Generate F1 Contribution Race

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: |
          pip install pillow

      - name: Generate F1 contribution animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ramanvhantale
        run: |
          python scripts/generate-car-contribution.py

      - name: Commit animation
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/contribution-car.gif

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update F1 contribution race"
            git push
          fi

          
