name: Pac-Man Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man contribution game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ramanvhantale
          games: "pacman"
          hide_month_labels: "false"

      - name: Publish Pac-Man animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
